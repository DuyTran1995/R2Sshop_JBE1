spring.application.name=R2Sshop

server.port=8081

# JPA Config
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:3306/R2Sshop
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

# Flyway config
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.schemas=R2Sshop
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:mysql://localhost:3306/R2Sshop

# JWT Config
jwt.config.security-key=your-256-bit-secret-key-here-very-long-and-secure
# 10 gi?
jwt.config.expiration-time=36000000